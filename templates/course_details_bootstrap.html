<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }} - تفاصيل الدورة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="card-title text-primary mb-3">{{ course.name }}</h1>
                <p class="text-muted lead">{{ course.description }}</p>
                <hr>
                <h3 class="mb-4">الدروس المرتبطة بالدورة</h3>
                {% if lessons %}
                    <div class="list-group">
                        {% for lesson in lessons %}
                            <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <h5 class="mb-1 text-dark">{{ lesson.title }}</h5>
                                    <p class="mb-0 text-muted small">{{ lesson.description|truncatechars:120 }}</p>
                                </div>
                                <span class="badge bg-primary rounded-pill">درس {{ forloop.counter }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="alert alert-info" role="alert">لا توجد دروس مضافة لهذه الدورة حتى الان.</div>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
